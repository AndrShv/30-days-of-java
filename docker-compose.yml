version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-for-diffr
    environment:
      POSTGRES_DB: payout_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 1111
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/db/changelog/changes/001-initial-schema.sql:/docker-entrypoint-initdb.d/init.sql


    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d payout_db" ]
      interval: 5s
      timeout: 5s
      retries: 5


  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-for-diffr
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP порт
      - "15672:15672"  # Management UI (http://localhost:15672)
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis-for-diffr
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5


volumes:
  postgres_data: