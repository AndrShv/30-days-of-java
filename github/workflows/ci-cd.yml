name: CI/CD Pipeline Example

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: payout_db
          POSTGRES_USER: root
          POSTGRES_PASSWORD: 1111
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d payout_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Build and Test with Maven
        run: ./mvnw clean verify
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: payout_db
          POSTGRES_USER: root
          POSTGRES_PASSWORD: 1111