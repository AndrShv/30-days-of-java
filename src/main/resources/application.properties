# Server Configuration
server.port=8081

# Spring Application
spring.application.name=idempotent-consumer-service

# Database Connection (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:payout_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres_password}
spring.datasource.driver-class-name=org.postgresql.Driver
# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml


# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0

# Jackson JSON Serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# Custom Business Configurations (Outbox Infrastructure)
outbox.scheduler.fixed-delay-ms=3000
outbox.scheduler.batch-size=50

outbox.rabbitmq.exchange=payout_outbox_exchange
outbox.rabbitmq.queue=payout_outbox_queue
outbox.rabbitmq.routing-key=payout_outbox_routing_key
outbox.rabbitmq.dlx=payout_outbox_dlx
outbox.rabbitmq.dlq=payout_outbox_dlq
outbox.rabbitmq.dlq-routing-key=payout_outbox_dlq_routing_key

order.rabbitmq.exchange=order_outbox_exchange
order.rabbitmq.queue=order_outbox_queue
order.rabbitmq.routing-key=order_outbox_routing_key
order.rabbitmq.dlx=order_outbox_dlx
order.rabbitmq.dlq=order_outbox_dlq
order.rabbitmq.dlq-routing-key=order_outbox_dlq_routing_key

# Logging Configuration
logging.level.root=INFO
logging.level.transactional_outbox_pattern=DEBUG
logging.level.org.springframework.amqp=INFO
logging.level.org.hibernate.SQL=DEBUG


# ==========================================
# Resilience4j Configurations
# ==========================================

# 1. Circuit Breaker Configuration
# Размыкает цепь, если 50% запросов из последних 10 завершились ошибкой или таймаутом
resilience4j.circuitbreaker.instances.externalPaymentApi.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.externalPaymentApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.externalPaymentApi.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.externalPaymentApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.externalPaymentApi.wait-duration-in-open-state=10000ms
resilience4j.circuitbreaker.instances.externalPaymentApi.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.externalPaymentApi.automatic-transition-from-open-to-half-open-enabled=true


# 2. Retry Configuration
# 3 попытки с экспоненциальной задержкой (1s, 2s)
resilience4j.retry.instances.externalPaymentApi.max-attempts=3
resilience4j.retry.instances.externalPaymentApi.wait-duration=1000ms
resilience4j.retry.instances.externalPaymentApi.enable-exponential-backoff=true
resilience4j.retry.instances.externalPaymentApi.exponential-backoff-multiplier=2

# 3. TimeLimiter Configuration (защита от зависания потоков)
# Если сторонний API отвечает дольше 2 секунд — бросаем TimeOutException
resilience4j.timelimiter.instances.externalPaymentApi.timeout-duration=2000ms
resilience4j.timelimiter.instances.externalPaymentApi.cancel-running-future=true