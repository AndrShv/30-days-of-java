server:
  port: 8081

spring:
  application:
    name: idempotent-consumer-service

  # Database Connection (PostgreSQL)
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:payout_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  # RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false # Не возвращать в основную очередь после исчерпания попыток -> отправляет в DLQ
        retry:
          enabled: true
          max-attempts: 3          # 3 попытки перед отправкой в DLQ
          initial-interval: 1000ms # Пауза 1 секунда
          multiplier: 2.0          # Экспоненциальное увеличение (1s, 2s, 4s)

  # Jackson JSON Serialization
  jackson:
    serialization:
      write-dates-as-timestamps: false

# Custom Business Configurations (Outbox, RabbitMQ Infrastructure & Scheduler)
outbox:
  scheduler:
    fixed-delay-ms: 3000
    batch-size: 50
  rabbitmq:
    exchange: payout_outbox_exchange
    queue: payout_outbox_queue
    routing-key: payout_outbox_routing_key
    dlx: payout_outbox_dlx           # Dead Letter Exchange
    dlq: payout_outbox_dlq           # Dead Letter Queue
    dlq-routing-key: payout_outbox_dlq_routing_key

# Logging Configuration
logging:
  level:
    root: INFO
    transactional_outbox_pattern: DEBUG
    org.springframework.amqp: INFO
    org.hibernate.SQL: DEBUG